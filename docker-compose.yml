# UrbanFlow Warehouse: Airflow 3 (LocalExecutor) + its metadata Postgres.
# Start:  docker compose build ; docker compose up -d      (run from this folder, in PowerShell)
# Stop:   docker compose down                              (named volumes are kept)
x-airflow-common: &airflow-common
  build: .
  image: urbanflow-warehouse/airflow:3.3.2
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local dev only, UI bound to 127.0.0.1
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    WAREHOUSE_PATH: /opt/airflow/data/warehouse.duckdb
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data          # landing zone + DuckDB file (gitignored)
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends-on
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16.13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  airflow-init:                          # one-shot: create/upgrade the metadata schema
    <<: *airflow-common
    command: db migrate

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: &after-init
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: *after-init

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on: *after-init

volumes:
  airflow_db:
